[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dicom-ai-router"
dynamic = ["version"]
description = "Route DICOM studies to AI models and back to PACS: rules, de-identification, SR + key image, audit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seth Turnbo" }]
keywords = ["dicom", "pacs", "radiology", "de-identification", "imaging-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydicom>=3.0",
  "pynetdicom>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/seth2177/dicom-ai-router"
Repository = "https://github.com/seth2177/dicom-ai-router"
Issues = "https://github.com/seth2177/dicom-ai-router/issues"

[project.scripts]
dicom-ai-router = "airouter.__main__:main"

[tool.hatch.version]
path = "airouter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["airouter"]

[tool.hatch.build.targets.wheel.force-include]
"config/router.yaml" = "airouter/_data/router.yaml"

[tool.hatch.build.targets.sdist]
include = [
  "/airouter",
  "/config",
  "/run_demo.py",
  "/requirements*.txt",
  "/README.md",
  "/LICENSE",
]
exclude = ["_LOCAL_ONLY*", "**/_LOCAL_ONLY*", "**/__pycache__"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
  "B008",  # FastAPI's File(...) default is the framework idiom
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient`",   # upstream notice from newer Starlette
]
